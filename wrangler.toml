name = "webproxy"
main = "worker/src/index.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./client/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "COOKIE_JAR"
class_name = "CookieJar"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CookieJar"]

[[kv_namespaces]]
binding = "USER_DATA"
id = "fbe05d6ecd5b47668ea0b8ca95399fed"

# Workers Free is capped at 10ms CPU time per request regardless of what's
# set here. If you're on Workers Paid (default 30s, configurable up to 5
# minutes), uncomment this to give the rewriting logic more headroom on
# large JS bundles — see README "Cloudflare platform limits" section.
# [limits]
# cpu_ms = 50